# ========================================================
# FarmAssist - Spring Boot Application Properties
# ========================================================
server.port=${PORT:8080}

# Application Name
spring.application.name=farmassist

# --------------------------------------------------------
# Primary Profile: MySQL Database Configuration
# --------------------------------------------------------
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/farmassist_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Enable SQL initialization if needed
spring.sql.init.mode=never

# Jackson Date Formatting
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=Asia/Kolkata
