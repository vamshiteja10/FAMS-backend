# ========================================================
# H2 In-Memory Profile (Zero Setup Local Testing)
# ========================================================
spring.datasource.url=jdbc:h2:mem:farmassist_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# H2 Web Console available at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Initialize demo data on startup in H2
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql
